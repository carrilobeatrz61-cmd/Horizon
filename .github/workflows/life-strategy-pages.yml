name: Publish Life Strategy OS
on:
  push:
    branches: [main]
    paths:
      - 'life-strategy-os/**'
      - '.github/workflows/life-strategy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./life-strategy-os
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
